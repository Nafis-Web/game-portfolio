<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GameCom Arena</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Trebuchet MS", Arial, sans-serif;
    }

    :root {
      --orange: #ff8a00;
      --orange2: #ff3c00;
      --purple: #b735ff;
      --cyan: #00eaff;
      --text: #ffffff;
      --muted: #aeb4c8;
    }

    body {
      min-height: 100vh;
      color: var(--text);
      overflow-x: hidden;
      background: #03040a;
    }

    .bg {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 20% 20%, rgba(255, 102, 0, 0.18), transparent 35%),
        radial-gradient(circle at 80% 30%, rgba(183, 53, 255, 0.18), transparent 35%),
        linear-gradient(rgba(0,0,0,0.72), rgba(0,0,0,0.92)),
        url("https://images.unsplash.com/photo-1519608487953-e999c86e7455?q=80&w=1600&auto=format&fit=crop")
        center/cover no-repeat;
      z-index: -3;
      filter: contrast(1.15) brightness(0.75);
    }

    .scanlines {
      position: fixed;
      inset: 0;
      background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 100% 4px;
      pointer-events: none;
      z-index: -1;
    }

    .arena {
      min-height: 100vh;
      padding: 18px;
    }

    header {
      height: 118px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      padding: 0 10px;
    }

    .top-nav,
    .dock,
    .machine {
      background: linear-gradient(145deg, rgba(10,13,27,0.95), rgba(2,3,10,0.95));
      border: 1px solid rgba(255,138,0,0.45);
      box-shadow:
        0 0 20px rgba(255, 102, 0, 0.22),
        inset 0 0 25px rgba(183, 53, 255, 0.08);
      clip-path: polygon(8% 0, 100% 0, 92% 100%, 0 100%, 0 18%);
    }

    .title-zone {
      text-align: center;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
    }

    .title-zone h2 {
      font-size: clamp(42px, 6vw, 78px);
      font-style: italic;
      letter-spacing: 4px;
      color: #ff9a17;
      line-height: 0.9;
      text-shadow:
        0 0 8px #ff3c00,
        0 0 22px rgba(255, 102, 0, 0.9),
        0 0 42px rgba(255, 138, 0, 0.45);
    }

    .title-zone span {
      display: block;
      margin-top: 12px;
      color: #d65cff;
      letter-spacing: 20px;
      font-size: 28px;
      font-style: italic;
      text-shadow: 0 0 16px rgba(183, 53, 255, 0.9);
    }

    .top-area {
      position: absolute;
      right: 10px;
      display: flex;
      gap: 18px;
      height: 76px;
      justify-content: flex-end;
      align-items: center;
    }

    .top-nav {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 0 24px;
      cursor: pointer;
      transition: 0.25s ease;
      color: white;
      font-weight: bold;
      letter-spacing: 1px;
      text-transform: uppercase;
      min-width: 130px;
    }

    .top-nav:hover {
      transform: translateY(-3px);
      border-color: var(--purple);
      box-shadow: 0 0 24px rgba(183, 53, 255, 0.45);
    }

    .dashboard {
      display: grid;
      grid-template-columns: 310px minmax(700px, 1fr);
      gap: 24px;
      align-items: stretch;
      min-height: calc(100vh - 158px);
    }

    .dock {
      padding: 20px;
      clip-path: polygon(8% 0, 92% 0, 100% 8%, 100% 100%, 0 100%, 0 8%);
    }

    .dock-title {
      color: var(--orange);
      text-align: center;
      font-size: 21px;
      letter-spacing: 1px;
      padding: 14px;
      margin-bottom: 22px;
      border: 1px solid rgba(255,138,0,0.25);
      background: rgba(0,0,0,0.35);
      text-transform: uppercase;
    }

    .game-btn {
      width: 100%;
      min-height: 96px;
      margin-bottom: 15px;
      display: grid;
      grid-template-columns: 74px 1fr;
      align-items: center;
      gap: 14px;
      background: rgba(6, 8, 22, 0.9);
      color: white;
      border: 1px solid rgba(183,53,255,0.8);
      padding: 14px;
      cursor: pointer;
      text-align: left;
      clip-path: polygon(8% 0, 88% 0, 100% 18%, 100% 82%, 92% 100%, 0 100%, 0 14%);
      transition: 0.25s ease;
      position: relative;
    }

    .game-btn:hover,
    .game-btn.active-btn {
      border-color: var(--orange);
      box-shadow:
        0 0 18px rgba(255,138,0,0.7),
        inset 0 0 22px rgba(255,102,0,0.15);
      transform: translateX(6px);
    }

    .game-btn.active-btn::after {
      content: "";
      position: absolute;
      right: -16px;
      top: 50%;
      transform: translateY(-50%);
      border-left: 16px solid var(--orange);
      border-top: 16px solid transparent;
      border-bottom: 16px solid transparent;
      filter: drop-shadow(0 0 10px var(--orange));
    }

    .game-icon {
      font-size: 46px;
      text-align: center;
      filter: drop-shadow(0 0 10px rgba(255,138,0,0.6));
    }

    .game-name {
      font-size: 20px;
      font-weight: bold;
      text-transform: uppercase;
    }

    .game-type {
      color: var(--orange);
      margin-top: 6px;
      font-size: 14px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .machine {
      padding: 18px;
      clip-path: polygon(4% 0, 96% 0, 100% 5%, 100% 88%, 88% 100%, 12% 100%, 0 88%, 0 5%);
      border-color: rgba(120, 128, 255, 0.45);
    }

    .marquee {
      height: 105px;
      display: grid;
      place-items: center;
      margin-bottom: 18px;
      background:
        radial-gradient(circle, rgba(255,138,0,0.13), transparent 70%),
        rgba(0,0,0,0.72);
      border: 2px solid rgba(255,138,0,0.6);
      clip-path: polygon(6% 0, 94% 0, 100% 20%, 100% 80%, 94% 100%, 6% 100%, 0 80%, 0 20%);
    }

    #currentGame {
      color: var(--orange);
      font-size: clamp(34px, 5vw, 62px);
      letter-spacing: 6px;
      text-transform: uppercase;
      text-shadow: 0 0 10px #ff3c00, 0 0 24px rgba(255,138,0,0.75);
    }

    .screen-shell {
      position: relative;
      min-height: 760px;
      background: #02040c;
      border: 3px solid var(--orange);
      border-radius: 26px;
      box-shadow:
        inset 0 0 35px rgba(255, 102, 0, 0.16),
        0 0 25px rgba(255, 102, 0, 0.3);
      padding: 16px;
      overflow: hidden;
    }

    .game-frame {
      width: 100%;
      height: 760px;
      border: none;
      display: block;
      background: black;
      border-radius: 16px;
    }

    .placeholder {
      position: absolute;
      inset: 16px;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      background:
        linear-gradient(rgba(6,8,20,0.92), rgba(6,8,20,0.92));
      border-radius: 16px;
    }

    .placeholder .pad {
      font-size: 90px;
      margin-bottom: 20px;
      color: var(--orange);
    }

    .placeholder h3 {
      font-size: 42px;
      margin-bottom: 18px;
    }

    .placeholder p {
      color: #d6d8e8;
      font-size: 20px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="bg"></div>
  <div class="scanlines"></div>

  <div class="arena">

    <header>

      <div class="title-zone">
        <h2>GAMECOM</h2>
        <span>ARENA</span>
      </div>

      <div class="top-area">
        <button class="top-nav" id="homeBtn">⌂ Home</button>
      </div>

    </header>

    <section class="dashboard">

      <aside class="dock">

        <div class="dock-title">Game Dock</div>

        <button class="game-btn" data-path="snake/snake.html" data-title="Snake">
          <div class="game-icon">🐍</div>
          <div>
            <div class="game-name">Snake</div>
            <div class="game-type">Classic</div>
          </div>
        </button>

        <button class="game-btn" data-path="tetris/tetris.html" data-title="Tetris">
          <div class="game-icon">🧱</div>
          <div>
            <div class="game-name">Tetris</div>
            <div class="game-type">Puzzle</div>
          </div>
        </button>

        <button class="game-btn" data-path="pong/pong.html" data-title="Ping Pong">
          <div class="game-icon">🏓</div>
          <div>
            <div class="game-name">Ping Pong</div>
            <div class="game-type">Arcade</div>
          </div>
        </button>

        <button class="game-btn" data-path="ink_spill/ink_spill.html" data-title="Ink Spill">
          <div class="game-icon">🎨</div>
          <div>
            <div class="game-name">Ink Spill</div>
            <div class="game-type">Puzzle</div>
          </div>
        </button>

        <button class="game-btn" data-path="Gem_Gem/gem_gem.html" data-title="Gem Gem">
          <div class="game-icon">💎</div>
          <div>
            <div class="game-name">Gem Gem</div>
            <div class="game-type">Match 3</div>
          </div>
        </button>

        <button class="game-btn" data-path="space_shooter/space_shooter.html" data-title="Space Shooter">
          <div class="game-icon">🚀</div>
          <div>
            <div class="game-name">Space Shooter</div>
            <div class="game-type">Shooter</div>
          </div>
        </button>

        <button class="game-btn" data-path="Neon_clutch/neon_clutch.html" data-title="Neon Clutch">
          <div class="game-icon">⚡</div>
          <div>
            <div class="game-name">Neon Clutch</div>
            <div class="game-type">Midterm</div>
          </div>
        </button>

      </aside>

      <main class="machine" id="machine">

        <div class="marquee">
          <div id="currentGame">SELECT GAME</div>
        </div>

        <div class="screen-shell">

          <div id="placeholder" class="placeholder">
            <div>
              <div class="pad">🎮</div>
              <h3>Ready To Play?</h3>
              <p>
                Select a game from the dock<br>
                and start playing
              </p>
            </div>
          </div>

          <iframe
            id="gameFrame"
            class="game-frame"
            title="Game Area"
            src="about:blank"
            allow="autoplay"
          ></iframe>

        </div>

      </main>

    </section>

  </div>

  <script>
    const gameButtons = document.querySelectorAll(".game-btn");
    const gameFrame = document.getElementById("gameFrame");
    const currentGame = document.getElementById("currentGame");
    const placeholder = document.getElementById("placeholder");
    const homeBtn = document.getElementById("homeBtn");
    const machine = document.getElementById("machine");

    function clearButtons() {
      gameButtons.forEach(btn => {
        btn.classList.remove("active-btn");
      });
    }

    function centerGameWindow() {
      setTimeout(() => {
        machine.scrollIntoView({
          behavior: "smooth",
          block: "center"
        });

        gameFrame.focus();
      }, 150);
    }

    function loadGame(path, button) {

      placeholder.style.display = "none";

      gameFrame.src = "about:blank";

      setTimeout(() => {
        gameFrame.src = path;
      }, 50);

      currentGame.textContent = button.dataset.title;

      clearButtons();

      button.classList.add("active-btn");

      centerGameWindow();
    }

    gameButtons.forEach(button => {

      button.addEventListener("click", () => {

        const path = button.dataset.path;

        loadGame(path, button);

      });

    });

    homeBtn.addEventListener("click", () => {

      gameFrame.src = "about:blank";

      currentGame.textContent = "SELECT GAME";

      placeholder.style.display = "flex";

      clearButtons();

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    });

    window.addEventListener("keydown", event => {

      const blocked = [
        "ArrowUp",
        "ArrowDown",
        "ArrowLeft",
        "ArrowRight",
        "Space"
      ];

      if (blocked.includes(event.code)) {
        event.preventDefault();
      }

    });
  </script>

</body>
</html>
