<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Space Shooter</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #070914;
      font-family: Arial, Helvetica, sans-serif;
      color: white;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      background:
        radial-gradient(circle at 20% 20%, rgba(0, 255, 200, 0.12), transparent 30%),
        radial-gradient(circle at 80% 15%, rgba(255, 138, 0, 0.14), transparent 35%),
        linear-gradient(180deg, #050712 0%, #101428 100%);
    }

    canvas {
      width: 100%;
      height: 100%;
      max-width: 1000px;
      max-height: 700px;
      display: block;
      background: #050814;
      border: 3px solid rgba(255, 138, 0, 0.85);
      border-radius: 18px;
      box-shadow:
        0 0 30px rgba(255, 138, 0, 0.35),
        0 0 45px rgba(0, 234, 255, 0.18);
    }
  </style>
</head>

<body>
  <canvas id="game" width="1000" height="700"></canvas>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    const WIDTH = canvas.width;
    const HEIGHT = canvas.height;

    const COLORS = {
      bg: "#070914",
      cyan: "#00eaff",
      orange: "#ff8a00",
      orange2: "#ff3c00",
      white: "#ffffff",
      red: "#ff4b6e",
      yellow: "#ffe066",
      purple: "#b735ff",
      green: "#66ffb3"
    };

    const audio = {
      shoot: new Audio("./audio/shoot.mp3"),
      explosion: new Audio("./audio/explosion.mp3"),
      hit: new Audio("./audio/hit.mp3"),
      power: new Audio("./audio/power.mp3"),
      bgm: new Audio("./audio/bgm.mp3")
    };

    audio.bgm.loop = true;
    audio.bgm.volume = 0.25;

    const images = {
      ship: new Image(),
      alien: new Image(),
      background: new Image()
    };

    images.ship.src = "./images/ship.png";
    images.alien.src = "./images/alien.png";
    images.background.src = "./images/background.png";

    let shipImageReady = false;
    let alienImageReady = false;
    let backgroundImageReady = false;

    images.ship.onload = () => {
      shipImageReady = true;
    };

    images.alien.onload = () => {
      alienImageReady = true;
    };

    images.background.onload = () => {
      backgroundImageReady = true;
    };

    images.ship.onerror = () => {
      shipImageReady = false;
      console.log("Optional image missing: ./images/ship.png");
    };

    images.alien.onerror = () => {
      alienImageReady = false;
      console.log("Optional image missing: ./images/alien.png");
    };

    images.background.onerror = () => {
      backgroundImageReady = false;
      console.log("Optional image missing: ./images/background.png");
    };

    let muted = false;
    let musicStarted = false;
    let gameState = "menu";

    let score = 0;
    let highScore = Number(localStorage.getItem("spaceShooterHighScore") || 0);
    let lives = 3;
    let level = 1;

    let keys = {};
    let bullets = [];
    let enemies = [];
    let particles = [];
    let floatingTexts = [];
    let stars = [];

    let enemySpawnTimer = 0;
    let shootCooldown = 0;

    const player = {
      x: WIDTH / 2,
      y: HEIGHT - 90,
      w: 70,
      h: 70,
      speed: 8
    };

    function setupStars() {
      stars = [];

      for (let i = 0; i < 120; i++) {
        stars.push({
          x: Math.random() * WIDTH,
          y: Math.random() * HEIGHT,
          size: Math.random() * 2.5 + 0.5,
          speed: Math.random() * 1.8 + 0.4
        });
      }
    }

    function playSound(name) {
      if (muted || !audio[name]) {
        return;
      }

      audio[name].currentTime = 0;
      audio[name].play().catch(() => {});
    }

    function startMusic() {
      if (!musicStarted) {
        musicStarted = true;

        if (!muted) {
          audio.bgm.play().catch(() => {});
        }
      }
    }

    function drawText(text, x, y, size, color, align = "left", glow = false) {
      ctx.save();
      ctx.font = `bold ${size}px Arial`;
      ctx.fillStyle = color;
      ctx.textAlign = align;

      if (glow) {
        ctx.shadowColor = color;
        ctx.shadowBlur = 15;
      }

      ctx.fillText(text, x, y);
      ctx.restore();
    }

    function addParticles(x, y, color) {
      for (let i = 0; i < 18; i++) {
        particles.push({
          x,
          y,
          vx: (Math.random() - 0.5) * 7,
          vy: (Math.random() - 0.5) * 7,
          life: 40,
          color
        });
      }
    }

    function addFloatingText(text, x, y, color) {
      floatingTexts.push({
        text,
        x,
        y,
        color,
        life: 60
      });
    }

    function resetGame() {
      startMusic();

      score = 0;
      lives = 3;
      level = 1;

      bullets = [];
      enemies = [];
      particles = [];
      floatingTexts = [];

      enemySpawnTimer = 0;
      shootCooldown = 0;

      player.x = WIDTH / 2;

      gameState = "playing";
    }

    function shootBullet() {
      if (shootCooldown > 0) {
        return;
      }

      bullets.push({
        x: player.x,
        y: player.y - 35,
        w: 6,
        h: 22,
        speed: 12
      });

      shootCooldown = 12;
      playSound("shoot");
    }

    function spawnEnemy() {
      const size = 42 + Math.random() * 20;

      enemies.push({
        x: size + Math.random() * (WIDTH - size * 2),
        y: -size,
        w: size,
        h: size,
        speed: 2.2 + Math.random() * 1.5 + level * 0.18,
        hp: level >= 5 ? 2 : 1,
        points: 100 + level * 20
      });
    }

    function updatePlaying() {
      if (keys.ArrowLeft || keys.a || keys.A) {
        player.x -= player.speed;
      }

      if (keys.ArrowRight || keys.d || keys.D) {
        player.x += player.speed;
      }

      if (keys.Space || keys[" "]) {
        shootBullet();
      }

      player.x = Math.max(player.w / 2, Math.min(WIDTH - player.w / 2, player.x));

      if (shootCooldown > 0) {
        shootCooldown--;
      }

      enemySpawnTimer++;

      const enemyDelay = Math.max(24, 68 - level * 4);

      if (enemySpawnTimer >= enemyDelay) {
        spawnEnemy();
        enemySpawnTimer = 0;
      }

      for (let i = bullets.length - 1; i >= 0; i--) {
        bullets[i].y -= bullets[i].speed;

        if (bullets[i].y < -40) {
          bullets.splice(i, 1);
        }
      }

      for (let i = enemies.length - 1; i >= 0; i--) {
        const enemy = enemies[i];

        enemy.y += enemy.speed;

        if (enemy.y > HEIGHT + 60) {
          enemies.splice(i, 1);
          lives--;

          addFloatingText("-1 LIFE", WIDTH - 90, 110, COLORS.red);
          playSound("hit");

          if (lives <= 0) {
            endGame();
          }

          continue;
        }

        const enemyHitPlayer =
          enemy.x < player.x + player.w / 2 &&
          enemy.x + enemy.w > player.x - player.w / 2 &&
          enemy.y < player.y + player.h / 2 &&
          enemy.y + enemy.h > player.y - player.h / 2;

        if (enemyHitPlayer) {
          enemies.splice(i, 1);
          lives--;
          addParticles(player.x, player.y, COLORS.red);
          addFloatingText("-1 LIFE", player.x, player.y - 40, COLORS.red);
          playSound("hit");

          if (lives <= 0) {
            endGame();
          }

          continue;
        }

        for (let j = bullets.length - 1; j >= 0; j--) {
          const bullet = bullets[j];

          const hit =
            bullet.x < enemy.x + enemy.w &&
            bullet.x + bullet.w > enemy.x &&
            bullet.y < enemy.y + enemy.h &&
            bullet.y + bullet.h > enemy.y;

          if (hit) {
            bullets.splice(j, 1);
            enemy.hp--;

            if (enemy.hp <= 0) {
              score += enemy.points;
              addParticles(enemy.x + enemy.w / 2, enemy.y + enemy.h / 2, COLORS.orange);
              addFloatingText("+" + enemy.points, enemy.x + enemy.w / 2, enemy.y, COLORS.yellow);
              enemies.splice(i, 1);
              playSound("explosion");
            } else {
              playSound("hit");
            }

            break;
          }
        }
      }

      level = Math.floor(score / 1000) + 1;

      updateEffects();
    }

    function updateEffects() {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];

        p.x += p.vx;
        p.y += p.vy;
        p.life--;

        if (p.life <= 0) {
          particles.splice(i, 1);
        }
      }

      for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const t = floatingTexts[i];

        t.y -= 0.5;
        t.life--;

        if (t.life <= 0) {
          floatingTexts.splice(i, 1);
        }
      }
    }

    function endGame() {
      gameState = "game_over";

      if (score > highScore) {
        highScore = score;
        localStorage.setItem("spaceShooterHighScore", highScore);
      }
    }

    function drawBackground() {
      if (backgroundImageReady) {
        ctx.drawImage(images.background, 0, 0, WIDTH, HEIGHT);
        ctx.fillStyle = "rgba(0, 0, 0, 0.35)";
        ctx.fillRect(0, 0, WIDTH, HEIGHT);
      } else {
        const bg = ctx.createLinearGradient(0, 0, 0, HEIGHT);
        bg.addColorStop(0, "#070914");
        bg.addColorStop(1, "#101428");

        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, WIDTH, HEIGHT);
      }

      for (const star of stars) {
        star.y += star.speed;

        if (star.y > HEIGHT) {
          star.y = 0;
          star.x = Math.random() * WIDTH;
        }

        ctx.fillStyle = "rgba(255,255,255,0.75)";
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.strokeStyle = "rgba(0,234,255,0.08)";

      for (let x = 0; x < WIDTH; x += 50) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, HEIGHT);
        ctx.stroke();
      }

      for (let y = 0; y < HEIGHT; y += 50) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(WIDTH, y);
        ctx.stroke();
      }
    }

    function drawPlayer() {
      if (shipImageReady) {
        ctx.drawImage(
          images.ship,
          player.x - player.w / 2,
          player.y - player.h / 2,
          player.w,
          player.h
        );
      } else {
        ctx.save();
        ctx.shadowColor = COLORS.cyan;
        ctx.shadowBlur = 25;

        ctx.fillStyle = COLORS.cyan;
        ctx.beginPath();
        ctx.moveTo(player.x, player.y - 42);
        ctx.lineTo(player.x - 34, player.y + 32);
        ctx.lineTo(player.x, player.y + 16);
        ctx.lineTo(player.x + 34, player.y + 32);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = COLORS.orange;
        ctx.beginPath();
        ctx.moveTo(player.x - 12, player.y + 30);
        ctx.lineTo(player.x, player.y + 55);
        ctx.lineTo(player.x + 12, player.y + 30);
        ctx.fill();

        ctx.restore();
      }
    }

    function drawBullets() {
      for (const bullet of bullets) {
        ctx.save();
        ctx.shadowColor = COLORS.orange;
        ctx.shadowBlur = 20;

        ctx.fillStyle = COLORS.orange;
        ctx.fillRect(bullet.x - bullet.w / 2, bullet.y, bullet.w, bullet.h);

        ctx.restore();
      }
    }

    function drawEnemies() {
      for (const enemy of enemies) {
        if (alienImageReady) {
          ctx.drawImage(images.alien, enemy.x, enemy.y, enemy.w, enemy.h);
        } else {
          ctx.save();

          ctx.shadowColor = COLORS.red;
          ctx.shadowBlur = 20;

          ctx.fillStyle = COLORS.red;
          ctx.beginPath();
          ctx.arc(enemy.x + enemy.w / 2, enemy.y + enemy.h / 2, enemy.w / 2, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = COLORS.white;
          ctx.beginPath();
          ctx.arc(enemy.x + enemy.w * 0.35, enemy.y + enemy.h * 0.42, 5, 0, Math.PI * 2);
          ctx.arc(enemy.x + enemy.w * 0.65, enemy.y + enemy.h * 0.42, 5, 0, Math.PI * 2);
          ctx.fill();

          ctx.restore();
        }
      }
    }

    function drawEffects() {
      for (const p of particles) {
        ctx.globalAlpha = p.life / 40;

        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
        ctx.fill();

        ctx.globalAlpha = 1;
      }

      for (const t of floatingTexts) {
        ctx.globalAlpha = t.life / 60;

        drawText(t.text, t.x, t.y, 20, t.color, "center", true);

        ctx.globalAlpha = 1;
      }
    }

    function drawHUD() {
      drawText("SCORE: " + score, 25, 40, 22, COLORS.white, "left", true);
      drawText("HIGH: " + highScore, 25, 72, 16, COLORS.yellow, "left");
      drawText("LEVEL: " + level, WIDTH / 2, 40, 22, COLORS.cyan, "center", true);
      drawText("LIVES: " + lives, WIDTH - 25, 40, 22, COLORS.red, "right", true);
      drawText("M: MUTE", WIDTH - 25, 72, 16, muted ? COLORS.red : COLORS.green, "right");
    }

    function drawMenu() {
      drawText("SPACE SHOOTER", WIDTH / 2, 175, 68, COLORS.orange, "center", true);
      drawText("Destroy enemy ships before they reach you.", WIDTH / 2, 265, 25, COLORS.white, "center");
      drawText("Move: ← → or A / D", WIDTH / 2, 345, 24, COLORS.cyan, "center");
      drawText("Shoot: SPACE", WIDTH / 2, 385, 24, COLORS.cyan, "center");
      drawText("Press SPACE to Start", WIDTH / 2, 490, 34, COLORS.yellow, "center", true);
    }

    function drawGameOver() {
      ctx.fillStyle = "rgba(0,0,0,0.55)";
      ctx.fillRect(0, 0, WIDTH, HEIGHT);

      drawText("GAME OVER", WIDTH / 2, 240, 72, COLORS.red, "center", true);
      drawText("FINAL SCORE: " + score, WIDTH / 2, 340, 34, COLORS.white, "center");
      drawText("Press R to Restart", WIDTH / 2, 430, 30, COLORS.yellow, "center", true);
    }

    function render() {
      drawBackground();
      drawBullets();
      drawEnemies();
      drawEffects();

      if (gameState === "menu") {
        drawMenu();
      }

      if (gameState === "playing") {
        drawPlayer();
        drawHUD();
      }

      if (gameState === "game_over") {
        drawPlayer();
        drawHUD();
        drawGameOver();
      }
    }

    function loop() {
      if (gameState === "playing") {
        updatePlaying();
      } else {
        updateEffects();
      }

      render();
      requestAnimationFrame(loop);
    }

    window.addEventListener("keydown", event => {
      keys[event.key] = true;
      keys[event.code] = true;

      if (["ArrowLeft", "ArrowRight", "Space"].includes(event.code)) {
        event.preventDefault();
      }

      if (gameState === "menu" && event.code === "Space") {
        resetGame();
      }

      if (gameState === "game_over" && event.key.toLowerCase() === "r") {
        resetGame();
      }

      if (event.key.toLowerCase() === "m") {
        muted = !muted;

        Object.values(audio).forEach(sound => {
          sound.muted = muted;
        });
      }
    });

    window.addEventListener("keyup", event => {
      keys[event.key] = false;
      keys[event.code] = false;
    });

    setupStars();
    loop();
  </script>
</body>
</html>
